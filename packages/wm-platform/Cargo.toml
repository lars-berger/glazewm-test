[package]
name = "wm-platform"
version = "0.0.0"
edition = "2021"

[lib]
path = "src/lib.rs"
test = false

[[test]]
name = "test"
harness = false
path = "src/test.rs"

[dependencies]
anyhow = { workspace = true }
home = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
serde = { workspace = true }
regex = { workspace = true }
ambassador = "0.4"

[dev-dependencies]
libtest-mimic-collect = "0.3.2"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.52", features = [
  "implement",
  "Win32_Devices_HumanInterfaceDevice",
  "Win32_Foundation",
  "Win32_Graphics_Dwm",
  "Win32_Graphics_Gdi",
  "Win32_Security",
  "Win32_System_Com",
  "Win32_System_Environment",
  "Win32_System_LibraryLoader",
  "Win32_System_Registry",
  "Win32_System_RemoteDesktop",
  "Win32_System_SystemServices",
  "Win32_System_Threading",
  "Win32_UI_Accessibility",
  "Win32_UI_HiDpi",
  "Win32_UI_Input_Ime",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Shell_Common",
  "Win32_UI_TextServices",
  "Win32_UI_WindowsAndMessaging",
], optional = true }
windows-interface = { version = "0.52", optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
accessibility-sys = { version = "0.2", optional = true }
dispatch2 = { version = "0.3", optional = true }
objc2-core-graphics = { version = "0.3.1", optional = true }
objc2 = { version = "0.6.1", optional = true }
objc2-app-kit = { version = "0.3.1", default-features = false, features = [
  "NSApplication",
  "NSEvent",
  "NSGraphics",
  "NSRunningApplication",
  "NSResponder",
  "NSScreen",
  "NSWindow",
  "NSWorkspace",
  "libc",
  "objc2-core-foundation",
], optional = true }
objc2-application-services = { version = "0.3.1", optional = true }
objc2-core-foundation = { version = "0.3.1", features = [
  "CFCGTypes",
], optional = true }
objc2-foundation = { version = "0.3.1", default-features = false, features = [
  "NSArray",
  "NSEnumerator",
  "NSNotification",
  "NSKeyValueCoding",
  "NSString",
  "NSThread",
  "NSValue",
], optional = true }

[build-dependencies]
cfg_aliases = "0.2.1"

[features]
# Default to both Platforms, `cfg_aliases` is used to check for platform and target OS
default = ["win", "mac"]
# No platform
detached = []
# Windows platform
win = ["dep:windows", "dep:windows-interface"]
# MacOS platform
mac = [
  "dep:accessibility-sys",
  "dep:dispatch2",
  "dep:objc2-core-graphics",
  "dep:objc2",
  "dep:objc2-app-kit",
  "dep:objc2-application-services",
  "dep:objc2-core-foundation",
  "dep:objc2-foundation",
]
